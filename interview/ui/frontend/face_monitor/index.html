<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #e8eaf1;
  }
  .wrap {
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(127, 140, 170, 0.24);
    background: rgba(127, 140, 170, 0.08);
  }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #10131c; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video { transform: scaleX(-1); }            /* mirror: feels like a mirror to the user */
  canvas { transform: scaleX(-1); pointer-events: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 18px; font-size: 13px; line-height: 1.5;
    background: rgba(16, 19, 28, 0.86); color: #e8eaf1;
  }
  .overlay.hidden { display: none; }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 11px; font-size: 12.5px; border-top: 1px solid rgba(127, 140, 170, 0.20);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7a8499; flex: 0 0 auto; }
  .dot.live { background: #33d17a; box-shadow: 0 0 0 3px rgba(51, 209, 122, .18); }
  .dot.warn { background: #f0ad4e; }
  .dot.bad  { background: #ef5f5f; }
  .status .txt { flex: 1 1 auto; }
  .status .count { opacity: .6; font-variant-numeric: tabular-nums; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 10px;
    border: 2.5px solid rgba(232, 234, 241, 0.25); border-top-color: #e8eaf1;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"><div><div class="spinner"></div><span id="ovtxt">Loading face analysis…</span></div></div>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="txt" id="stxt">Starting…</span>
    <span class="count" id="cnt"></span>
  </div>
</div>

<script type="module">
"use strict";

/* ------------------------------------------------------------------ *
 * Streamlit component protocol (implemented by hand — no npm build).
 * ------------------------------------------------------------------ */
const Streamlit = {
  ready() {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  },
  setFrameHeight(h) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
  },
  setValue(value) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setComponentValue",
        value: value, dataType: "json" }, "*");
  },
};

const VISION_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";
const MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const DETECT_INTERVAL_MS = 160;   // ~6 fps — bounded CPU cost on the visitor's device
const FLUSH_INTERVAL_MS  = 2500;  // batch delta uploads
const CENTER_TOLERANCE   = 0.18;

const els = {
  video: document.getElementById("vid"),
  canvas: document.getElementById("cv"),
  overlay: document.getElementById("ov"),
  overlayText: document.getElementById("ovtxt"),
  dot: document.getElementById("dot"),
  statusText: document.getElementById("stxt"),
  count: document.getElementById("cnt"),
};

const state = {
  started: false,
  active: false,
  questionIdx: -1,
  status: "pending",
  detail: "",
  landmarker: null,
  stream: null,
  pending: [],      // samples not yet flushed
  batchId: 0,
  sentThisQuestion: 0,
  lastDetect: 0,
  lastFlush: 0,
  rafId: null,
  flushTimer: null,
};

function syncHeight() { Streamlit.setFrameHeight(document.body.scrollHeight + 4); }

function setStatus(status, detail, overlayMessage) {
  state.status = status;
  state.detail = detail || "";
  els.statusText.textContent = detail || status;
  els.dot.className = "dot " +
    (status === "running" ? "live"
     : status === "pending" ? "warn"
     : (status === "denied" || status === "error" || status === "unsupported") ? "bad" : "");

  if (overlayMessage) {
    els.overlay.classList.remove("hidden");
    els.overlay.innerHTML = "<div>" + overlayMessage + "</div>";
  } else {
    els.overlay.classList.add("hidden");
  }
  syncHeight();
  flush(true);
}

/* ------------------------------------------------------------------ *
 * Geometry helpers — convention-free proxies computed from landmarks.
 * ------------------------------------------------------------------ */
const NOSE_TIP = 1, EYE_OUTER_A = 33, EYE_OUTER_B = 263, CHIN = 152, FOREHEAD = 10;

function buildSample(landmarks) {
  let minX = 1, maxX = 0, minY = 1, maxY = 0;
  for (const p of landmarks) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const faceWidth = Math.max(1e-6, maxX - minX);
  const faceHeight = Math.max(1e-6, maxY - minY);

  const nose = landmarks[NOSE_TIP];
  const eyeA = landmarks[EYE_OUTER_A];
  const eyeB = landmarks[EYE_OUTER_B];
  const chin = landmarks[CHIN];
  const brow = landmarks[FOREHEAD];

  // Horizontal head turn: with the head square-on, the nose sits midway
  // between the eye corners, so min/max of the two gaps approaches 1.
  const dA = Math.abs(nose.x - eyeA.x);
  const dB = Math.abs(nose.x - eyeB.x);
  const symmetry = Math.min(dA, dB) / Math.max(1e-6, Math.max(dA, dB));

  // Vertical tilt: where the nose sits between brow and chin.
  const span = Math.abs(chin.y - brow.y) || 1e-6;
  const noseRatio = (nose.y - brow.y) / span;          // ~0.5 looking straight ahead
  const verticalOk = noseRatio > 0.32 && noseRatio < 0.72;

  const centered =
    Math.abs(cx - 0.5) <= CENTER_TOLERANCE && Math.abs(cy - 0.5) <= CENTER_TOLERANCE;

  // Framing: face should fill a sensible slice of frame — not tiny, not cropped.
  const wellFramed = faceWidth > 0.14 && faceWidth < 0.75 && faceHeight < 0.95;

  return {
    face: true,
    score: Math.max(0, Math.min(1, symmetry)),
    cx, cy,
    centered,
    eye_contact: symmetry > 0.62 && verticalOk && wellFramed,
  };
}

function drawBox(landmarks) {
  const ctx = els.canvas.getContext("2d");
  const w = els.canvas.width, h = els.canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!landmarks) return;

  let minX = 1, maxX = 0, minY = 1, maxY = 0;
  for (const p of landmarks) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  ctx.strokeStyle = "rgba(79, 124, 255, 0.9)";
  ctx.lineWidth = 2;
  ctx.strokeRect(minX * w, minY * h, (maxX - minX) * w, (maxY - minY) * h);
}

/* ------------------------------------------------------------------ *
 * Upload — only small deltas, on a slow cadence.
 * ------------------------------------------------------------------ */
function flush(force) {
  const now = performance.now();
  if (!force && now - state.lastFlush < FLUSH_INTERVAL_MS) return;
  if (!force && state.pending.length === 0) return;

  state.lastFlush = now;
  const samples = state.pending;
  state.pending = [];
  state.sentThisQuestion += samples.length;
  state.batchId += 1;

  Streamlit.setValue({
    batch_id: state.batchId,
    question_idx: state.questionIdx,
    status: state.status,
    detail: state.detail,
    samples: samples,
  });

  els.count.textContent = state.sentThisQuestion ? state.sentThisQuestion + " samples" : "";
}

/* ------------------------------------------------------------------ *
 * Camera + model lifecycle
 * ------------------------------------------------------------------ */
async function start() {
  if (state.started) return;
  state.started = true;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("unsupported", "Camera not available in this browser",
      "This browser doesn’t expose a camera to web pages.<br>The interview works " +
      "normally without it — your answers are still scored.");
    return;
  }
  if (typeof WebAssembly === "undefined") {
    setStatus("unsupported", "WebAssembly unavailable",
      "Face analysis needs WebAssembly, which this browser doesn’t support.<br>" +
      "The interview works normally without it.");
    return;
  }

  // 1. Camera first, so a permission denial doesn't waste a 15 MB model download.
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" },
      audio: false,
    });
  } catch (err) {
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    setStatus(denied ? "denied" : "error",
      denied ? "Camera permission denied" : "Camera unavailable",
      denied
        ? "Camera access was blocked.<br>That’s completely fine — answers are scored " +
          "on content, not appearance. Allow camera in your browser’s address bar to enable it."
        : "Couldn’t open the camera (it may be in use by another app).<br>" +
          "The interview works normally without it.");
    return;
  }

  els.video.srcObject = state.stream;
  try { await els.video.play(); } catch (e) { /* autoplay policies; muted+playsinline usually fine */ }

  // 2. Load MediaPipe WASM + model from CDN (cached by the browser afterwards).
  try {
    els.overlayText.textContent = "Loading face model…";
    const vision = await import(`${VISION_CDN}/vision_bundle.mjs`);
    const fileset = await vision.FilesetResolver.forVisionTasks(`${VISION_CDN}/wasm`);
    state.landmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: false,
      outputFacialTransformationMatrixes: false,
    });
  } catch (err) {
    setStatus("error", "Face model failed to load",
      "The face-analysis model couldn’t be downloaded.<br>" +
      "Your answers are still recorded and scored normally.");
    stopCamera();
    return;
  }

  els.canvas.width = 320;
  els.canvas.height = 240;

  setStatus("running", "Face analysis active", null);
  state.lastFlush = performance.now();
  state.flushTimer = setInterval(() => flush(false), FLUSH_INTERVAL_MS);
  loop();
}

function loop() {
  state.rafId = requestAnimationFrame(loop);

  if (!state.active || !state.landmarker || els.video.readyState < 2) return;

  const now = performance.now();
  if (now - state.lastDetect < DETECT_INTERVAL_MS) return;
  state.lastDetect = now;

  let result;
  try {
    result = state.landmarker.detectForVideo(els.video, now);
  } catch (e) {
    return; // transient WASM hiccup; next frame will retry
  }

  const faces = result && result.faceLandmarks;
  if (faces && faces.length > 0) {
    state.pending.push(buildSample(faces[0]));
    drawBox(faces[0]);
  } else {
    state.pending.push({ face: false, score: 0, cx: 0.5, cy: 0.5, centered: false, eye_contact: false });
    drawBox(null);
  }

  // Hard cap so a long-running tab can never balloon memory.
  if (state.pending.length > 400) state.pending.splice(0, state.pending.length - 400);
}

function stopCamera() {
  if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
  if (state.flushTimer) { clearInterval(state.flushTimer); state.flushTimer = null; }
  if (state.stream) {
    state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null;
  }
  els.video.srcObject = null;
}

/* ------------------------------------------------------------------ *
 * Render events from Python
 * ------------------------------------------------------------------ */
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};

  const active = !!args.active;
  const questionIdx = typeof args.question_idx === "number" ? args.question_idx : 0;

  if (questionIdx !== state.questionIdx) {
    // New question: flush whatever is left, then reset the local counter.
    if (state.pending.length) flush(true);
    state.questionIdx = questionIdx;
    state.sentThisQuestion = 0;
    els.count.textContent = "";
  }

  state.active = active;

  if (active && !state.started) {
    start();
  } else if (!active && state.started) {
    stopCamera();
    state.started = false;
    setStatus("disabled", "Camera off", "Camera is off for this interview.");
  }

  syncHeight();
});

window.addEventListener("pagehide", stopCamera);

Streamlit.ready();
syncHeight();
</script>
</body>
</html>
