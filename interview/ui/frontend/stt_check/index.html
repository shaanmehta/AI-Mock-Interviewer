<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #e8eaf1;
  }
  .warn {
    font-size: 13px; line-height: 1.5; padding: 11px 13px; border-radius: 11px;
    background: rgba(239, 95, 95, 0.13);
    border: 1px solid rgba(239, 95, 95, 0.40);
  }
  .warn b { font-weight: 650; }
  .warn code {
    background: rgba(127,140,170,.20); padding: 1px 5px; border-radius: 5px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  // Live transcription is the Web Speech API, which Safari and most Firefox
  // builds do not implement. Detecting it directly is far more reliable than
  // sniffing the User-Agent, and it catches the exact failure that silently
  // produced empty transcripts and a meaningless score.
  var supported =
    typeof window.SpeechRecognition !== "undefined" ||
    typeof window.webkitSpeechRecognition !== "undefined";

  if (supported) {
    // Stay completely out of the way when everything is fine.
    document.body.style.display = "none";
    return;
  }

  document.getElementById("root").innerHTML =
    '<div class="warn">' +
      "<b>This browser can't do live transcription.</b><br>" +
      "Your answers would not be captured. Go back and choose " +
      "<b>Record, then transcribe</b>, which works in every browser " +
      "&mdash; or simply type your answers in the box below. Typed answers " +
      "are scored exactly the same." +
    "</div>";
})();
</script>
</body>
</html>
